[project]
name = "voice-stress-911"
version = "1.0.0"
description = "911 Under-Threat Voice Stress Detection System - single-machine MLOps reference implementation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Core dependencies are shared by every service (API, UI, training).
dependencies = [
    "numpy>=1.26,<3",
    "soundfile>=0.12.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Deep-learning + audio feature stack (training and inference).
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "librosa>=0.10.2",
]
# FastAPI inference service.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
]
# Experiment tracking + model registry client/server.
tracking = [
    "mlflow>=3.6",
]
# Streamlit dispatcher console (deliberately light: no torch).
ui = [
    "streamlit>=1.50",
    "pandas>=2.2",
    "requests>=2.32",
    "altair>=5.3",
]

[dependency-groups]
# Installed by default with `uv sync` on a developer laptop / CI.
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "dvc>=3.50",
]

# ---------------------------------------------------------------------------
# PyTorch CPU wheels: on Linux/Windows the default PyPI torch wheel bundles
# ~2.5 GB of CUDA libraries. We pin torch/torchvision to the official CPU-only
# index so laptop installs and Docker images stay small. macOS uses PyPI
# (Apple wheels are CPU/MPS only anyway).
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File()/Form() defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: tests that train a real (tiny) network; excluded from the fast CI lane",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx`:Warning",
]
