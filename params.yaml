# Single source of truth for every tunable number in the system.
# DVC tracks this file: changing a value here invalidates exactly the
# pipeline stages that depend on it (see `params:` in dvc.yaml).

audio:
  sample_rate: 16000        # data contract: 16 kHz
  channels: 1               # data contract: mono
  window_seconds: 2.0       # sliding analysis window
  hop_seconds: 0.5          # window step
  min_duration_seconds: 1.0 # shorter clips are rejected; 1-2 s clips are zero-padded to one window
  max_duration_seconds: 600

features:
  n_mels: 64
  n_fft: 400                # 25 ms analysis frame
  hop_length: 160           # 10 ms frame step -> 201 frames per 2 s window
  n_mfcc: 20
  fmin: 50
  fmax: 8000

data:
  raw_dir: data/raw
  features_dir: data/features
  manifest: data/manifests/manifest.csv
  classes: [calm, stressed]   # VOICE classes (CREMA-D neutral vs fear); index 1 = stressed voice
  test_fraction: 0.2
  val_fraction: 0.1
  min_class_ratio: 0.30       # distribution floor: each class >= 30% of clips
  seed: 42

synthetic:                    # CI test fixtures ONLY (scripts/generate_synthetic_data.py) - not training data
  clips_per_class: 80
  min_clip_seconds: 3.0
  max_clip_seconds: 6.0
  seed: 911

train:
  architecture: resnet18_2d  # resnet18_2d (Log-Mel) | resnet18_1d (MFCC)
  epochs: 6
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 7

mlflow:
  tracking_uri: http://localhost:5000   # overridden by $MLFLOW_TRACKING_URI
  experiment_name: covert-call-911
  registered_model_name: covert-call-detector

quality_gate:
  min_accuracy_margin: 0.015   # delta on threat-decision accuracy vs the champion
  min_covert_recall: 0.90      # missed covert (under-threat) calls are the worst failure
  max_genuine_false_alarm: 0.05  # a stressed caller with a REAL emergency must not alert
  min_voice_accuracy: 0.65     # voice model must clearly beat chance on unseen speakers
  max_p95_latency_ms: 150      # single-window CPU voice inference budget
  latency_trials: 100
  # Course 7 (slide 6): a new model version is *continuous delivery* - the gate
  # filters automatically, a human approves the promotion.
  auto_promote: false
  # Assumption used to build simulated test calls (transcript + real recording):
  # probability that the caller's voice is a "fear" recording, per scenario.
  stress_profile:
    genuine_emergency: 0.80
    covert: 0.60
    non_emergency: 0.10
  # Course 7 (slide 12): behavioural tests
  behavioural:
    min_functionality_accuracy: 0.90   # canonical calls incl. the pizza traps
    invariance_min_agreement: 0.90     # swap address/name/food + ASR noise -> same class
    directional_max_genuine_alert: 0.02  # genuine emergency, max stress -> (almost) never alert
    directional_min_covert_alert: 0.85   # covert content, calm voice -> still alerts
    clips_per_slice: 40                # held-out clips per (sex x channel) voice slice
    slice_min_accuracy: 0.60
    slice_min_recall_stressed: 0.55

serving:                       # voice-stress TIMELINE shown to the dispatcher (information only;
                               # the alert itself is the fusion decision above)
  duress_threshold: 0.82       # theta: a window counts as "stressed" above this
  consecutive_windows: 3       # >= K stressed windows in a row = "sustained stress" run

rollout:                       # Course 4: online evaluation of @challenger vs @champion
  mode: champion_only          # champion_only | shadow | canary | ab | bandit
  canary:
    steps: [10, 25, 50, 100]   # % of calls routed to the challenger
    min_challenger_calls_per_step: 20
    max_latency_ratio: 1.10    # challenger p95 <= 1.1 x champion p95 (+ slack)
    latency_slack_ms: 3.0      # absorbs laptop timing jitter at millisecond scale
    error_z_critical: 1.645    # one-sided 5% pooled z-test on the error rate
    collapse_share: 0.98       # >98% windows in one class while champion is mixed
    psi_warn: 0.10
    psi_major: 0.25
  ab:
    alpha: 0.05
    power: 0.80
    baseline_rate: 0.85        # expected correct-decision rate of the champion
    mde: 0.10                  # smallest improvement worth detecting (absolute)
  bandit:
    policy: thompson           # thompson | ucb1 | epsilon_greedy
    epsilon: 0.10
    floor: 0.05                # every arm keeps >= 5% of traffic

text:                          # content branch: what the caller SAYS
  transcripts: data/text/transcripts.csv
  per_family: 60               # transcripts generated per scenario family
  seed: 911
  min_class_ratio: 0.20        # each class >= 20% of the transcripts
  model:
    ngram_max: 2
    min_df: 2
    C: 2.0

fusion:                        # how content and voice are combined (transparent rule)
  # threat = p_covert * (base + stress_weight * stress)
  #        + incongruence_weight * p_non_emergency * stress
  # stress = mean P(stressed) over the call's 2 s windows (acoustic model).
  # A stressed caller reporting a genuine emergency adds NOTHING: stress is expected.
  # Calibrated on the VALIDATION families (never the test set): with 0.70/0.30 only 82%
  # of calm-voiced covert calls alerted; a covert caller often sounds calm on purpose,
  # so content carries most of the weight and voice stress adds suspicion on top.
  covert_base: 0.85
  covert_stress_weight: 0.25
  incongruence_weight: 0.40    # a terrified voice asking a "harmless" question
  alert_threshold: 0.50        # >= -> red PRIORITY alert (possible covert call)
  review_threshold: 0.30       # >= -> amber "review" flag
