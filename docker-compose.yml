# 911 Under-Threat Voice Stress Detection System - single-host deployment.
#
#   docker compose up -d mlflow-server      # 1. tracking server (needed for training)
#   uv run dvc repro                        # 2. train + gate on the host -> @champion
#   docker compose up -d --build            # 3. full stack
#
# All three services share the private bridge network `911-net` and find each
# other by service name (http://stress-api:8000, http://mlflow-server:5000).
# Host ports are bound to 127.0.0.1 only, so nothing is exposed to the LAN.

name: voice-stress-911

x-common: &common
  restart: unless-stopped
  networks: [911-net]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  mlflow-server:
    <<: *common
    build: { context: ., target: mlflow }
    image: voice-stress-911/mlflow-server:1.0.0
    container_name: mlflow-server
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow          # SQLite backend store + model artifacts survive restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  stress-api:
    <<: *common
    build: { context: ., target: api }
    image: voice-stress-911/stress-api:1.0.0
    container_name: stress-api
    environment:
      MODEL_SOURCE: ${MODEL_SOURCE:-auto}            # auto = MLflow @champion, else models/champion.pt
      MLFLOW_TRACKING_URI: http://mlflow-server:5000  # service-name DNS on 911-net
      MODEL_NAME: voice-stress-detector
      MODEL_ALIAS: champion
      MODEL_PATH: /app/models/champion.pt
      TELEMETRY_DB: /app/telemetry/telemetry.db
      MODEL_LOAD_DELAY_SECONDS: ${MODEL_LOAD_DELAY_SECONDS:-5}   # makes the 503 phase visible
      FAKE_SCORES: ${FAKE_SCORES:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro                  # offline fallback checkpoint, read-only
      - ./params.yaml:/app/params.yaml:ro        # tune theta / K without rebuilding
      - telemetry-data:/app/telemetry            # SQLite audit log survives restarts
    depends_on:
      mlflow-server:
        condition: service_healthy
    healthcheck:
      # Startup probe: 30 s budget to load weights; failures are ignored meanwhile.
      # Readiness probe: /health returns 503 until the model is ready, then 200.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3g }

  dispatcher-ui:
    <<: *common
    build: { context: ., target: ui }
    image: voice-stress-911/dispatcher-ui:1.0.0
    container_name: dispatcher-ui
    environment:
      API_URL: http://stress-api:8000
      DEMO_DIR: /app/data/demo
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data/demo:/app/data/demo:ro
    depends_on:
      stress-api:
        condition: service_healthy   # UI only starts once the model is READY (HTTP 200)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

networks:
  911-net:
    name: 911-net
    driver: bridge

volumes:
  mlflow-data:
  telemetry-data:
