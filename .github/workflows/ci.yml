name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"

jobs:
  # 1. Static checks: seconds, no dependencies installed.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff check
        run: uvx ruff check --output-format=github .
      - name: ruff format --check
        run: uvx ruff format --check .

  # 2. Data contracts on a freshly generated dataset (format, SHA-256 leakage, class floors).
  data-contracts:
    name: Data contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Generate small synthetic dataset
        run: >
          uv run --no-project --with numpy --with scipy --with soundfile --with pyyaml --with pydantic
          python -m scripts.generate_synthetic_data --clips-per-class 12
      - name: Build split manifest
        run: >
          uv run --no-project --with numpy --with soundfile --with pyyaml --with pydantic
          python -m src.data_contracts prepare
      - name: Validate data contracts (fails the build on violation)
        run: >
          uv run --no-project --with numpy --with soundfile --with pyyaml --with pydantic
          python -m src.data_contracts validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-contract-report
          path: reports/data_contract.json

  # 3. Unit + FakeModel integration tests: no GPU, no weights, no MLflow server.
  test:
    name: Pytest (FakeModel)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install (CPU-only torch from the PyTorch index)
        run: uv sync --extra ml --extra api
      - name: Run fast test suite
        run: uv run pytest -m "not slow" --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: reports/junit.xml

  # 4. Model smoke test: the whole DVC pipeline offline with a 1-epoch model.
  model-smoke:
    name: Pipeline smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync --extra ml --extra api --extra tracking
      - run: uv run pytest -m slow

  # 5. Only tested code becomes images: build all three targets and boot the
  #    stack with the FakeModel to prove probes + networking work end to end.
  docker:
    name: Build images + container smoke test
    needs: [test, data-contracts, model-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build
      - name: Boot stack (FakeModel) and wait for healthchecks
        env:
          MODEL_SOURCE: fake
          MODEL_LOAD_DELAY_SECONDS: "3"
        run: |
          mkdir -p models data/demo
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
      - name: Probe endpoints across 911-net
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8501/_stcore/health
          curl -fsS http://127.0.0.1:5000/health
          docker compose exec -T dispatcher-ui python -c "import urllib.request; print(urllib.request.urlopen('http://stress-api:8000/health').read())"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
